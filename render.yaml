# Render "Blueprint" - lets you deploy this whole app with one click from
# the Render dashboard (New -> Blueprint -> pick this repo) instead of
# clicking through every setting by hand.
#
# Only the backend/ folder is deployed here - the frontend/ folder is a
# separate static site meant for Vercel (see README.md).
#
# Secrets (marked sync: false below) are NOT stored in this file - Render
# will prompt you to type each one in during the blueprint setup, and they
# stay private in Render's dashboard, never in this repo.
services:
  - type: web
    name: job-scout
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        # JobSpy 1.1.82 pins NumPy 1.26.3, which does not ship a Python 3.13
        # wheel. Python 3.12 has a compatible binary dependency set.
        value: 3.12.12
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        # Your Vercel URL, once you have it (e.g. https://job-scout.vercel.app).
        # Safe to leave blank for now - edit it in Render's dashboard later,
        # which will auto-redeploy. Comma-separate if you have more than one.
        value: ""
